name: Build Ultron Mobile Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-bridge/**"
      - ".github/workflows/android-bridge.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-bridge/**"
      - ".github/workflows/android-bridge.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: JARVIS UI and permission safety contract
        run: node ../tests/jarvis-bridge-ui-security.mjs

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-bridge-v0.7.0-debug
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
