name: Cloudflare Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'modules/jarvis-global-weather.js'
      - 'modules/jarvis-weather-model.js'
      - 'modules/jarvis-weather-insight-model.js'
      - 'modules/jarvis-world-geodata.js'
      - 'modules/jarvis-spatial-intensity.js'
      - '.github/workflows/cloudflare-backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultron-cloudflare-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical Worker and weather intelligence
        run: |
          node --check worker.js
          node --check weather-intelligence.js
          node --check weather-monitor.js
          node --check ../modules/jarvis-world-geodata.js
          node ../tests/jarvis-architecture-snapshot.mjs
          node ../tests/jarvis-world-geodata.mjs
      - name: Validate Wrangler config
        run: |
          grep -q '"main": "worker.js"' wrangler.jsonc
          grep -q '"name": "ultron-backend"' wrangler.jsonc

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Embed source provenance from checked-out GitHub commit
        run: |
          set -euo pipefail
          node ../scripts/architecture-snapshot-to-sql.mjs --module > architecture-deploy-manifest.js
          grep -q "$GITHUB_SHA" architecture-deploy-manifest.js
          node --check architecture-deploy-manifest.js

      - name: Deploy canonical Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for attempt in 1 2 3; do
            echo "Deploy Cloudflare (attempt ${attempt}/3)"
            if npx --yes wrangler@4.157.0 deploy --config wrangler.jsonc; then
              echo "Deploy completed."
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Cloudflare deploy failed after 3 attempts."
              exit 1
            fi
            sleep 15
          done
      - name: Verify production health
        env:
          BACKEND_HEALTH_URL: https://ultron-backend.lucaalves17-20.workers.dev/api/health
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 "$BACKEND_HEALTH_URL"; then
              echo
              echo "Ultron backend is healthy."
              exit 0
            fi
            echo "Health check attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "Production backend health check failed."
          exit 1
      - name: Verify authenticated Bridge endpoint is deployed
        env:
          BACKEND_BRIDGE_URL: https://ultron-backend.lucaalves17-20.workers.dev/api/bridge/heartbeat
        run: |
          # A deliberately invalid credential must reach our new Cloudflare
          # route and return 401 JSON. This request cannot pair a device,
          # claim a queued command, or mark an offline Bridge as online.
          for attempt in 1 2 3 4 5; do
            response_file=$(mktemp)
            status=$(curl --silent --show-error --max-time 15 \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"deviceId":"deployment-probe","deviceSecret":"invalid"}' \
              --output "$response_file" --write-out '%{http_code}' \
              "$BACKEND_BRIDGE_URL" || true)
            if [ "$status" = "401" ] && grep -q 'Credencial do dispositivo inválida' "$response_file"; then
              echo "Bridge endpoint deployed and rejecting invalid credentials."
              rm -f "$response_file"
              exit 0
            fi
            echo "Bridge route probe attempt $attempt returned HTTP $status."
            rm -f "$response_file"
            sleep 5
          done
          echo "::error::Production Bridge route was not verified as deployed."
          exit 1

      - name: Verify live JARVIS project conversation contract
        env:
          JARVIS_AI_URL: https://ultron-backend.lucaalves17-20.workers.dev/api/ai
        run: |
          node --input-type=module <<'NODE'
          const response=await fetch(process.env.JARVIS_AI_URL,{
            method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({message:"O que você achou do nosso projeto?",clientOwnsSpeech:true})
          });
          const data=await response.json().catch(()=>({}));
          if(!response.ok || data.model!=="project-evaluation" ||
             !/Neural Ring/.test(data.text||"") ||
             /Olá|telemetria disponível|não há informações suficientes/i.test(data.text||"") ||
             data.webResearch?.requested!==false){
            console.error("STAGE A PRODUCTION CONTRACT FAILED",{
              status:response.status,model:data.model||null,
              backendVersion:data.backendVersion||null,reason:data.error||null
            });
            process.exit(1);
          }
          console.log("STAGE A PRODUCTION CONVERSATION VERIFIED:",data.model);
          NODE

      - name: Verify live JARVIS source-grounded architecture contract
        env:
          JARVIS_AI_URL: https://ultron-backend.lucaalves17-20.workers.dev/api/ai
        run: |
          node --input-type=module <<'NODE'
          // Production proof: repository CI success alone does not show that
          // the deployed Worker serves the corrected architecture-audit route.
          const message="J.A.R.V.I.S., analise sua arquitetura real. Identifique as colunas da tabela memories no D1, os arquivos responsáveis pelo fallback dos provedores de IA e o tempo máximo de cooldown do circuit breaker. Cite os arquivos correspondentes e não invente informações.";
          const response=await fetch(process.env.JARVIS_AI_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json","Cache-Control":"no-cache"},
            body:JSON.stringify({message,clientOwnsSpeech:true}),
            cache:"no-store",
            signal:AbortSignal.timeout(20000)
          });
          const data=await response.json().catch(()=>({}));
          const text=String(data?.text||"");
          const passed=response.ok&&data?.model==="live-architecture-audit"&&
            (data?.architectureInspection?.github?.liveReadAvailable===true||
             data?.architectureInspection?.github?.snapshotAvailable===true)&&
            data?.architectureInspection?.github?.files?.every(f=>f.ok)===true&&
            data?.architectureInspection?.memory?.verified===true&&
            data?.architectureInspection?.circuitBreaker?.cooldownMs===30000&&
            /backend\/memory\.js/.test(text)&&
            /backend\/provider-circuit-breaker\.js/.test(text)&&
            /operator_id/.test(text)&&
            /30000 ms/.test(text)&&
            !/MemoryCore|AIOrchestrator|StarkCore/.test(text.split("EVIDÊNCIA")[0]);
          if(!passed){
            // Log only non-sensitive code/schema provenance, never memory contents.
            console.error("LIVE ARCHITECTURE EVIDENCE",{
              repository:data?.architectureInspection?.repository||null,
              mode:data?.architectureInspection?.github?.mode||null,
              githubError:data?.architectureInspection?.github?.error||null,
              lastSyncedAt:data?.architectureInspection?.github?.snapshotSyncedAt||null,
              githubFiles:data?.architectureInspection?.github?.files||[],
              columnsConfirmed:data?.architectureInspection?.memory?.verified===true,
              d1Ready:data?.architectureInspection?.d1?.ready===true,
              cooldownMs:data?.architectureInspection?.circuitBreaker?.cooldownMs??null
            });
            console.error("LIVE ARCHITECTURE AUDIT FAILED",{
              status:response.status,model:data?.model||null,
              backendVersion:data?.backendVersion||null,
              reason:data?.error||"contract-not-satisfied"
            });
            process.exit(1);
          }
          // Reproduce the exact operator-facing request. This previously
          // produced a false-positive CI pass while the user saw no manifest.
          const operatorQuestion="J.A.R.V.I.S., execute uma auditoria da sua arquitetura agora. Informe o repositório técnico exato, o commit incorporado ao Worker, a origem da evidência do código, o horário da consulta, as colunas reais do D1 e o cooldown do circuit breaker. Não confunda uma consulta ao vivo com dados sincronizados no deploy.";
          const operatorResponse=await fetch(process.env.JARVIS_AI_URL,{
            method:"POST",headers:{"Content-Type":"application/json","Cache-Control":"no-cache"},
            body:JSON.stringify({message:operatorQuestion,clientOwnsSpeech:true,
              telemetry:{systemCapabilities:{memory:true,starkCore:true}}}),
            cache:"no-store",signal:AbortSignal.timeout(20000)
          });
          const operatorData=await operatorResponse.json().catch(()=>({}));
          const inspected=operatorData?.architectureInspection;
          const operatorPassed=operatorResponse.ok&&operatorData.model==="live-architecture-audit"&&
            inspected?.repository==="equipezero-web/Ultron_AI"&&
            inspected?.github?.mode==="worker-deployed-source-manifest"&&
            inspected?.github?.snapshotAvailable===true&&
            /^[a-f0-9]{40}$/.test(inspected?.commit||"")&&
            inspected?.memory?.verified===true&&
            inspected?.d1?.ready===true&&
            inspected?.circuitBreaker?.cooldownMs===30000&&
            String(operatorData.text||"").includes("equipezero-web/Ultron_AI")&&
            !/Jarvis_AI|jarvisai/i.test(operatorData.text||"");
          if(!operatorPassed){
            console.error("OPERATOR LIVE ARCHITECTURE CONTRACT FAILED",{
              status:operatorResponse.status,model:operatorData.model||null,
              repository:inspected?.repository||null,
              mode:inspected?.github?.mode||null,
              snapshotAvailable:inspected?.github?.snapshotAvailable||false,
              sourceCommit:inspected?.commit||null,d1Ready:inspected?.d1?.ready||false,
              cooldownMs:inspected?.circuitBreaker?.cooldownMs??null
            });
            process.exit(1);
          }
          console.log("EXACT OPERATOR AUDIT VERIFIED:",inspected.github.mode,inspected.commit);
          console.log("LIVE ARCHITECTURE AUDIT DEPLOY SOURCE VERIFIED:",data.model,
            data.architectureInspection.commit,data.architectureInspection.checkedAt);
          NODE
