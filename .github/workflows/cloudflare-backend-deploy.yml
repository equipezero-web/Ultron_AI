name: Cloudflare Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/cloudflare-backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultron-cloudflare-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical Worker
        run: node --check worker.js
      - name: Validate Wrangler config
        run: |
          grep -q '"main": "worker.js"' wrangler.jsonc
          grep -q '"name": "ultron-backend"' wrangler.jsonc

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy canonical Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc
      - name: Verify production health
        env:
          BACKEND_HEALTH_URL: https://ultron-backend.lucaalves17-20.workers.dev/api/health
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 "$BACKEND_HEALTH_URL"; then
              echo
              echo "Ultron backend is healthy."
              exit 0
            fi
            echo "Health check attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "Production backend health check failed."
          exit 1
