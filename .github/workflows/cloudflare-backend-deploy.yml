name: Cloudflare Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'modules/jarvis-global-weather.js'
      - 'modules/jarvis-weather-model.js'
      - 'modules/jarvis-weather-insight-model.js'
      - 'modules/jarvis-world-geodata.js'
      - 'modules/jarvis-spatial-intensity.js'
      - '.github/workflows/cloudflare-backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultron-cloudflare-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical Worker and weather intelligence
        run: |
          node --check worker.js
          node --check weather-intelligence.js
          node --check weather-monitor.js
          node --check ../modules/jarvis-world-geodata.js
          node ../tests/jarvis-world-geodata.mjs
      - name: Validate Wrangler config
        run: |
          grep -q '"main": "worker.js"' wrangler.jsonc
          grep -q '"name": "ultron-backend"' wrangler.jsonc

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy canonical Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for attempt in 1 2 3; do
            echo "Deploy Cloudflare (attempt ${attempt}/3)"
            if npx --yes wrangler@4.157.0 deploy --config wrangler.jsonc; then
              echo "Deploy completed."
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Cloudflare deploy failed after 3 attempts."
              exit 1
            fi
            sleep 15
          done
      - name: Verify production health
        env:
          BACKEND_HEALTH_URL: https://ultron-backend.lucaalves17-20.workers.dev/api/health
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 "$BACKEND_HEALTH_URL"; then
              echo
              echo "Ultron backend is healthy."
              exit 0
            fi
            echo "Health check attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "Production backend health check failed."
          exit 1
      - name: Verify authenticated Bridge endpoint is deployed
        env:
          BACKEND_BRIDGE_URL: https://ultron-backend.lucaalves17-20.workers.dev/api/bridge/heartbeat
        run: |
          # A deliberately invalid credential must reach our new Cloudflare
          # route and return 401 JSON. This request cannot pair a device,
          # claim a queued command, or mark an offline Bridge as online.
          for attempt in 1 2 3 4 5; do
            response_file=$(mktemp)
            status=$(curl --silent --show-error --max-time 15 \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"deviceId":"deployment-probe","deviceSecret":"invalid"}' \
              --output "$response_file" --write-out '%{http_code}' \
              "$BACKEND_BRIDGE_URL" || true)
            if [ "$status" = "401" ] && grep -q 'Credencial do dispositivo inválida' "$response_file"; then
              echo "Bridge endpoint deployed and rejecting invalid credentials."
              rm -f "$response_file"
              exit 0
            fi
            echo "Bridge route probe attempt $attempt returned HTTP $status."
            rm -f "$response_file"
            sleep 5
          done
          echo "::error::Production Bridge route was not verified as deployed."
          exit 1
