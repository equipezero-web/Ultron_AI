name: Visual Neural Stream Check

on:
  push:
    paths:
      - 'index.html'
      - 'script.js'
      - 'modules/stark-bootstrap.js'
      - 'modules/visual-neural-stream-bridge-v4225.js'
      - 'modules/remote-camera-frame-gate-v4230.js'
      - 'modules/remote-camera-display-v4232.js'
      - 'modules/remote-camera-mode-v4232.js'
      - 'modules/mobile-camera-source.js'
      - 'modules/mobile-link-simple-v4250.js'
      - 'modules/mobile-performance.js'
      - 'modules/mobile-performance.css'
      - 'modules/neural-spatial-control-v4250.js'
      - 'modules/neural-focus-v4250.css'
      - 'modules/stark-camera-preview.js'
      - 'modules/stark-camera-preview.css'
      - 'modules/stark-hand-gesture-v420.js'
  pull_request:
    paths:
      - 'index.html'
      - 'script.js'
      - 'modules/stark-bootstrap.js'
      - 'modules/visual-neural-stream-bridge-v4225.js'
      - 'modules/remote-camera-frame-gate-v4230.js'
      - 'modules/remote-camera-display-v4232.js'
      - 'modules/remote-camera-mode-v4232.js'
      - 'modules/mobile-camera-source.js'
      - 'modules/mobile-link-simple-v4250.js'
      - 'modules/mobile-performance.js'
      - 'modules/mobile-performance.css'
      - 'modules/neural-spatial-control-v4250.js'
      - 'modules/neural-focus-v4250.css'
      - 'modules/stark-camera-preview.js'
      - 'modules/stark-camera-preview.css'
      - 'modules/stark-hand-gesture-v420.js'
  workflow_dispatch:

jobs:
  visual-neural-stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check script.js
          node --check modules/visual-neural-stream-bridge-v4225.js
          node --check modules/remote-camera-frame-gate-v4230.js
          node --check modules/remote-camera-display-v4232.js
          node --check modules/remote-camera-mode-v4232.js
          node --check modules/mobile-camera-source.js
          node --check modules/mobile-link-simple-v4250.js
          node --check modules/mobile-performance.js
          node --check modules/neural-spatial-control-v4250.js
          node --check modules/stark-bootstrap.js
          node --check modules/stark-camera-preview.js
          node --check modules/stark-hand-gesture-v420.js
      - name: Verify real-frame gated Optical Sensor and Neural 360 integration
        run: |
          grep -Eq "stark-bootstrap.js\?v=4\.25\.[0-9]+" index.html
          grep -Eq "// v4\.25\.0" index.html
          grep -q "visual-neural-stream-bridge-v4225.js?v=4.23.0" modules/stark-bootstrap.js
          grep -Eq "remote-camera-frame-gate-v4230.js\?v=4\.23\.[0-9]+" modules/stark-bootstrap.js
          grep -q "remote-camera-display-v4232.js?v=4.23.2" modules/stark-bootstrap.js
          grep -q "remote-camera-mode-v4232.js?v=4.23.2" modules/stark-bootstrap.js
          grep -q "mobile-performance.js?v=4.24.0" modules/stark-bootstrap.js
          grep -q "mobile-camera-source.js?v=4.25.0" modules/stark-bootstrap.js
          grep -q "neural-spatial-control-v4250.js?v=4.25.0" modules/stark-bootstrap.js
          grep -q "neural-focus-v4250.css?v=4.25.0" modules/stark-bootstrap.js
          grep -q "ULTRON_VISUAL_NEURAL_STREAM" modules/visual-neural-stream-bridge-v4225.js
          grep -q "hasDecodedFrame" modules/visual-neural-stream-bridge-v4225.js
          grep -q "ULTRON_REMOTE_CAMERA_FRAME_GATE" modules/remote-camera-frame-gate-v4230.js
          grep -q "requestVideoFrameCallback" modules/remote-camera-frame-gate-v4230.js
          grep -q "videoWidth" modules/remote-camera-frame-gate-v4230.js
          grep -q "videoHeight" modules/remote-camera-frame-gate-v4230.js
          grep -q "camera-frame-ready" modules/remote-camera-frame-gate-v4230.js
          grep -q "ULTRON_HAND_GESTURES?.disable" modules/remote-camera-frame-gate-v4230.js
          grep -q "ULTRON_REMOTE_CAMERA_DISPLAY" modules/remote-camera-display-v4232.js
          grep -q "ULTRON_REMOTE_CAMERA_MODE" modules/remote-camera-mode-v4232.js
          grep -q "ULTRON_NEURAL_3D" modules/neural-spatial-control-v4250.js
          grep -q "activateOpticalHands" modules/neural-spatial-control-v4250.js
          grep -q "AZIMUTH 360°" index.html
          ! grep -q "mobile-sensor-fusion-v4240.js" modules/stark-bootstrap.js
          ! grep -q "MotionSensor" script.js
          ! grep -q 'id="motion-events"' index.html
          ! grep -q 'id="emotion-state"' index.html
          echo 'Optical Sensor + Neural 360 + remote real-frame integration OK'
