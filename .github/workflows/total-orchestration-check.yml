  workflow_dispatch:

jobs:
  total-orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check orchestration runtime
        run: |
          node --check modules/ultron-core-bridge-v4270.js
          node --check modules/ultron-orchestrator-v4270.js
          node --check modules/neural-priority-core-v4300.js
          node --check modules/orchestrator-device-verify-v4270.js
          node --check modules/voice-listener-v4290.js
          node --check modules/voice-match-v4290.js
          node --check modules/voice-orchestration-bridge-v4290.js
          node --check modules/orchestrator-ui-bridge-v4270.js
          node --check modules/telemetry-client-v4270.js
          node --check backend/orchestration-engine.js
          node --check backend/worker.js
          node --check modules/jarvis-action-engine.js
          node --check modules/jarvis-intent-engine.js
          node --check modules/jarvis-task-context.js
          node --check backend/task-context.js
          node tests/jarvis-autonomy.mjs
          node --check modules/jarvis-clear-interface.js
          node tests/jarvis-clear-interface.mjs
          node tests/jarvis-meteorological-sources.mjs
          node --check modules/jarvis-meteorological-center.js
          node tests/jarvis-phase1.mjs
          node --check modules/jarvis-geospatial-model.js
          node --check modules/jarvis-geospatial-visual.js
          node --check modules/jarvis-earth.js
          node tests/jarvis-phase3.mjs
          node tests/jarvis-phase3-geospatial.mjs
          node --check modules/jarvis-weather-model.js
          node --check backend/weather-live.js
          node tests/jarvis-phase4.mjs
          node --check modules/jarvis-global-weather.js
          node --check backend/weather-global.js
          node tests/jarvis-global-weather.mjs
          node --check modules/jarvis-spatial-intensity.js
          node tests/jarvis-spatial-intensity.mjs
          node --check modules/jarvis-world-geodata.js
          node --check modules/jarvis-world-intent.js
          node tests/jarvis-world-geodata.mjs
          node --check modules/jarvis-tsunami-simulation.js
          node tests/jarvis-tsunami-simulation.mjs
          node --check backend/weather-watchlist.js
          node tests/jarvis-weather-watchlist.mjs
          node --check backend/weather-intelligence.js
          node --check backend/weather-monitor.js
          node tests/jarvis-weather-intelligence.mjs
          node tests/jarvis-weather-monitor.mjs
          node --check modules/jarvis-media-model.js
          node --check modules/ultron-neural-answer.js
          node tests/jarvis-phase2-media.mjs

      - name: Verify persistent orchestration backend
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS orchestration_runs' backend/orchestration-engine.js
          grep -q 'CREATE TABLE IF NOT EXISTS orchestration_steps' backend/orchestration-engine.js
          grep -q 'buildOperationalPlan' backend/orchestration-engine.js
          grep -q 'startOrchestration' backend/orchestration-engine.js
          grep -q 'recordOrchestrationStep' backend/orchestration-engine.js
          grep -q 'finishOrchestration' backend/orchestration-engine.js
          grep -q 'resultVerification: true' backend/orchestration-engine.js
          grep -q 'multiStep: true' backend/orchestration-engine.js
          grep -q '"/api/orchestrator/start"' backend/worker.js
          grep -q '"/api/orchestrator/step"' backend/worker.js
          grep -q '"/api/orchestrator/finish"' backend/worker.js
          grep -q '"/api/orchestrator/history"' backend/worker.js
          grep -q '"/api/orchestrator/state"' backend/worker.js
          grep -q 'totalIntegration: true' backend/worker.js
          grep -q 'safeSelfHeal: true' backend/worker.js
          grep -q 'async scheduled' backend/worker.js
          grep -q 'processDueAutomations' backend/worker.js
          grep -q '"main": "worker.js"' backend/wrangler.jsonc
          ! grep -q 'import baseWorker' backend/worker.js
          ! grep -Eq '"main": "worker-v[0-9]+\.js"' backend/wrangler.jsonc
          grep -q '"\* \* \* \* \*"\]' backend/wrangler.jsonc

      - name: Verify unified frontend routing and priority gate
        run: |
          grep -q 'ULTRON_ORCHESTRATOR' modules/ultron-orchestrator-v4270.js
          grep -q 'splitCompound' modules/ultron-orchestrator-v4270.js
          grep -q 'multi-step' modules/ultron-orchestrator-v4270.js
          grep -q 'ULTRON_DEVICES' modules/ultron-orchestrator-v4270.js
          grep -q 'ULTRON_VISION_ROUTER' modules/ultron-orchestrator-v4270.js
          grep -q 'ULTRON_NEURAL_3D' modules/ultron-orchestrator-v4270.js
          grep -q 'ULTRON_CORE' modules/ultron-orchestrator-v4270.js
          grep -q 'SELF-HEAL' modules/ultron-orchestrator-v4270.js
          grep -q 'ULTRON_PRIORITY' modules/neural-priority-core-v4300.js
          grep -q 'EMERGENCY STOP' modules/neural-priority-core-v4300.js
          grep -q '/api/control/status' modules/orchestrator-device-verify-v4270.js
          grep -q 'verificationTimeout: true' modules/orchestrator-device-verify-v4270.js
          grep -q 'command.status === "completed"' modules/orchestrator-device-verify-v4270.js
          grep -q 'ULTRON_VOICE_ORCHESTRATION_BRIDGE' modules/voice-orchestration-bridge-v4290.js
          grep -q 'wakeAwareDispatch: true' modules/voice-orchestration-bridge-v4290.js
          grep -q 'ULTRON_ORCHESTRATOR_UI' modules/orchestrator-ui-bridge-v4270.js
          grep -q 'window.ULTRON_CORE' modules/ultron-core-bridge-v4270.js

      - name: Verify proactive telemetry without emotion or motion classifier
        run: |
          grep -q 'orchestration:' modules/telemetry-client-v4270.js
          grep -q 'proactiveRecoveries' modules/telemetry-client-v4270.js
          grep -q 'holographic3d' modules/telemetry-client-v4270.js
          grep -q 'optical:' modules/telemetry-client-v4270.js
          ! grep -q 'emotionEstimate' modules/telemetry-client-v4270.js
          ! grep -q 'reaction-activity' modules/telemetry-client-v4270.js
          ! grep -q '^    motion:' modules/telemetry-client-v4270.js

      - name: Verify orchestration runtime load order and current release marker
        run: |
          grep -Eq '(TOTAL ORCHESTRATION|P0→P5|NEURAL INTERACTION|J\.A\.R\.V\.I\.S NEURAL COMMAND)' index.html
          grep -Fq 'J.A.R.V.I.S INTERACTIVE COMMAND CENTER // v4.35.0' index.html
          grep -Eq 'ultron-core-bridge-v4270[.]js[?]v=4[.][0-9]+[.][0-9]+' index.html
          grep -Eq 'ultron-orchestrator-v4270[.]js[?]v=4[.][0-9]+[.][0-9]+' index.html
          grep -q 'neural-priority-core-v4300.js?v=4.30.0' index.html
          grep -Eq 'device-control-v4260[.]js[?]v=4[.][0-9]+[.][0-9]+' index.html
          grep -q 'orchestrator-device-verify-v4270.js?v=4.27.0' index.html
          grep -q 'telemetry-client-v4270.js?v=4.27.0' index.html
          grep -Eq 'voice-match-v4290\.js\?v=4\.(29|31)\.0' index.html
          grep -Eq 'voice-listener-v4290\.js\?v=4\.(29|31)\.0' index.html
          grep -Eq 'voice-orchestration-bridge-v4290\.js\?v=4\.(29|31)\.0' index.html
          grep -q 'orchestrator-ui-bridge-v4270.js?v=4.27.0' index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const order = [
            'ultron-core-bridge-v4270.js',
            'ultron-orchestrator-v4270.js',
            'neural-priority-core-v4300.js',
            'device-control-v4260.js',
            'orchestrator-device-verify-v4270.js',
            'voice-match-v4290.js',
            'voice-listener-v4290.js',
            'voice-orchestration-bridge-v4290.js',
            'orchestrator-ui-bridge-v4270.js'
          ];
          let previous = -1;
          for (const marker of order) {
            const index = html.indexOf(marker);
            if (index < 0) throw new Error(`missing ${marker}`);
            if (index <= previous) throw new Error(`load order invalid at ${marker}`);
            previous = index;
          }
          console.log('Total orchestration load order OK');
          NODE

      - name: Verify safety boundaries
        run: |
          grep -q 'activeDeviceActionsRequireIntent: true' backend/worker.js
          grep -q 'destructiveActionsBlockedWithoutPolicy: true' backend/worker.js
          grep -q 'observe-auto/active-confirm/destructive-block' backend/orchestration-engine.js
          ! grep -qi 'desktop\.shell\|shell\.exec\|eval(' modules/ultron-orchestrator-v4270.js modules/neural-priority-core-v4300.js
          echo 'Total orchestration safety and integration checks passed.'


  phase4-live-production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test live Pages and Cloudflare Worker
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const urls = {
            health:'https://ultron-backend.lucaalves17-20.workers.dev/api/health',
            forecast:'https://ultron-backend.lucaalves17-20.workers.dev/api/geo/weather?city=recife',
            site:'https://equipezero-web.github.io/Ultron_AI/'
          };
          async function fetchPublic(name,url) {
            let lastError;
            for(let attempt=1;attempt<=3;attempt++){
              try {
                const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(10000)});
                const body=await response.text();
                console.log(name,'HTTP',response.status,'content-type',response.headers.get('content-type'),'sample',body.slice(0,380));
                assert.equal(response.status,200,name+' returned non-200 HTTP');
                return {response,body};
              }catch(error){lastError=error;console.log(name,'attempt',attempt,'failed:',String(error));}
            }
            throw lastError;
          }
          const health=JSON.parse((await fetchPublic('health',urls.health)).body);
          assert.equal(health.status,'online','Live Worker not healthy');
          const weather=JSON.parse((await fetchPublic('forecast',urls.forecast)).body);
          assert.equal(weather.ok,true,'Live Phase 4 route not operational');
          assert.equal(weather.city?.key,'recife','Wrong weather city');
          assert.equal(weather.kind,'short-term-numeric-forecast','Wrong forecast kind');
          assert.ok(weather.days?.length>=1,'No forecast days');
          assert.ok(weather.source?.url?.includes('open-meteo.com'),'Missing source');
          const site=(await fetchPublic('site',urls.site)).body;
          assert.ok(site.includes('jarvis-geospatial-visual.js'),'Frontend geographical module missing in public Pages');
          console.log('PHASE4 LIVE PRODUCTION VERIFIED',JSON.stringify({city:weather.city.name,fetchedAt:weather.fetchedAt,days:weather.days.length}));
          NODE


  global-weather-live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm worldwide weather endpoints and frontend are published
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://ultron-backend.lucaalves17-20.workers.dev';
          const site='https://equipezero-web.github.io/Ultron_AI/';
          const check=async(name,url)=>{
            let error;
            for(let i=0;i<4;i++){
              try {
                const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(13000)});
                const body=await r.text();
                console.log(name,'HTTP',r.status,body.slice(0,500));
                assert.equal(r.status,200,name+' is not publicly available');
                return body;
              }catch(e){error=e;if(i<3)await new Promise(resolve=>setTimeout(resolve,4000));}
            }
            throw error;
          };
          const backend=await fetch(base+'/api/geo/locations?q=Tokyo',{signal:AbortSignal.timeout(12000)});
          console.log('Cloudflare World route:',backend.status,'(200=deployed, 404=fallback required)');
          assert.ok([200,404].includes(backend.status),'Unexpected Worker status');
          if(backend.status===200){
            const verified=await fetch(base+'/api/geo/global?city=Tokyo&days=16',{signal:AbortSignal.timeout(20000)});
            const body=await verified.text();
            console.log('Cloudflare Tokyo forecast',verified.status,body.slice(0,550));
            if(verified.status===200){
              const decoded=JSON.parse(body);
              assert.equal(decoded.ok,true);
              assert.equal(decoded.location.countryCode,'JP');
              assert.ok(decoded.days.length>=15&&decoded.days.length<=16,'Forecast range must reflect provider availability');
              assert.equal(decoded.requestedDays,16);
              assert.equal(decoded.partialForecast,decoded.days.length<16);
              assert.ok(decoded.source.url.includes('open-meteo.com'));
              console.log('WORKER GLOBAL 16-DAY FORECAST VERIFIED');
            }else{
              assert.equal(verified.status,502,'Unexpected Worker weather failure');
              const error=JSON.parse(body);
              assert.equal(error.ok,false);
              console.log('::warning::Worldwide forecast returned a validated 502; provider/model data may be temporarily unavailable. No forecast was invented.');
              try{
                const direct=new URL('https://api.open-meteo.com/v1/forecast');
                for(const [key,value] of Object.entries({
                  latitude:'35.6895',longitude:'139.69171',timezone:'auto',forecast_days:'16',
                  current:'temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m',
                  daily:'temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max'
                }))direct.searchParams.set(key,value);
                const raw=await (await fetch(direct,{signal:AbortSignal.timeout(12000)})).json();
                console.log('FORECAST_DIAGNOSTIC',JSON.stringify({
                  fetchedAt:new Date().toISOString(),timezone:raw.timezone,utc_offset_seconds:raw.utc_offset_seconds,
                  current:raw.current,
                  dates:raw.daily?.time?.slice(0,3),
                  lastDates:raw.daily?.time?.slice(-3),
                  lengths:Object.fromEntries(Object.entries(raw.daily||{}).map(([key,value])=>[key,value?.length])),
                  nullFields:Object.fromEntries(Object.entries(raw.daily||{}).map(([key,value])=>
                    [key,Array.isArray(value)?value.map((x,i)=>x===null?i:null).filter(x=>x!==null).slice(0,10):[]]))
                }));
              }catch(error){console.log('FORECAST_DIAGNOSTIC_FAILED',String(error));}

            }
          }

          const monitor=await fetch(base+'/api/geo/monitor',{signal:AbortSignal.timeout(12000)});
          const monitorJson=await monitor.json();
          console.log('Cloudflare D1 monitor',monitor.status,'regions',monitorJson.regions?.length||0,'last',monitorJson.checkedAt);
          assert.equal(monitor.status,200,'Persistent meteorology monitor must be readable');
          assert.equal(monitorJson.tracked?.length,6);
          const home=await check('pages',site);
          assert.match(home,/jarvis-geospatial-visual[.]js[?]v=4[.][0-9]+[.][0-9]+/);
          const world=await check('world-map-module',site+'modules/jarvis-global-weather.js?v=4.73.0');
          assert.match(world,/globalWeatherScenario/);
          const recovery=await check('direct-fallback-module',site+'backend/weather-global.js?v=4.74.0');
          assert.match(recovery,/loadGlobalWeather/);
          const locations=JSON.parse(await check('open-meteo-geocoding',
            'https://geocoding-api.open-meteo.com/v1/search?name=Tokyo&count=1&language=pt'));
          assert.ok(locations.results.some(c=>c.country_code==='JP'));
          const data=JSON.parse(await check('open-meteo-16days',
            'https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&timezone=auto&forecast_days=16&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max'));
          assert.equal(data.daily.time.length,16);
          console.log('WORLD WEATHER AVAILABLE IN PRODUCTION: fallback modules and Open-Meteo source; Worker HTTP '+backend.status);
          NODE

  cloudflare-main-deploy-status:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Inspect Cloudflare deploy workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/equipezero-web/Ultron_AI/actions/workflows/cloudflare-backend-deploy.yml/runs?branch=main&per_page=6' --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.created_at,.html_url] | @tsv'

  global-weather-cors-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium client
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24.33.0
      - name: Verify CORS directly from published JARVIS origin
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({
            executablePath:process.env.CHROME_BIN||'/usr/bin/google-chrome',
            headless:true,args:['--no-sandbox','--disable-dev-shm-usage']
          });
          try {
            const page=await browser.newPage();
            await page.goto('https://equipezero-web.github.io/Ultron_AI/',{waitUntil:'domcontentloaded',timeout:30000});
            const result=await page.evaluate(async()=>{
              const geo=await fetch('https://geocoding-api.open-meteo.com/v1/search?name=Tokyo&count=1&language=pt');
              const places=await geo.json();
              const forecast=await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&forecast_days=3&current=temperature_2m&timezone=auto');
              const data=await forecast.json();
              return {geocodeStatus:geo.status,forecastStatus:forecast.status,
                countryCode:places.results?.[0]?.country_code,hasTemperature:typeof data.current?.temperature_2m==='number'};
            });
            console.log('Browser CORS result',JSON.stringify(result));
            assert.equal(result.geocodeStatus,200);
            assert.equal(result.forecastStatus,200);
            assert.equal(result.countryCode,'JP');
            assert.equal(result.hasTemperature,true);
          } finally {await browser.close();}
          NODE

  sampled-weather-live-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect actual regional model coordinate aggregation
        run: |
          node --input-type=module <<'NODE'
          import {loadSpatialIntensity} from './modules/jarvis-spatial-intensity.js';
          const layers=['rain','temp','soil','air','marine','river'];
          let successes=0;
          for(const layer of layers){
            const response=await loadSpatialIntensity({layer,region:'brazil',day:0});
            console.log('REAL SPATIAL',layer,JSON.stringify({ok:response.ok,
              cells:response.sampledCount,requested:response.totalSamples,
              time:response.dataTime,source:response.source?.name,
              error:response.error,status:response.status}).slice(0,500));
            if(response.ok&&response.sampledCount>0)successes++;
          }
          console.log('REAL SPATIAL SOURCES VERIFIED:',successes,'of',layers.length);
          // Provider outage must be explicit and never turn into fake colors.
          NODE

  live-world-geo-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe actual worldwide official event and indicator APIs
        run: |
          node --input-type=module <<'NODE'
          import {loadWorldGeo} from './modules/jarvis-world-geodata.js';
          const topics=['earthquakes','wildfires','population','gdp','co2'];
          const loggedFetch=async(url,options={})=>{
            const start=Date.now();
            try{
              const res=await fetch(url,options);
              console.log('WORLD GEO PROVIDER HTTP',new URL(url).hostname,new URL(url).pathname,
                res.status,'elapsedMs',Date.now()-start);
              return res;
            }catch(error){
              console.log('WORLD GEO PROVIDER ERROR',new URL(url).hostname,
                error?.name,String(error?.message||error),'elapsedMs',Date.now()-start);
              throw error;
            }
          };
          let ok=0;
          for(const topic of topics){
            const value=await loadWorldGeo({topic,region:'world'},{fetchImpl:loggedFetch});
            console.log('REAL WORLD GEODATA',topic,JSON.stringify({
              ok:value.ok,count:value.recordCount,source:value.dataset?.source?.url,
              period:value.dataset?.source?.basePeriod,error:value.error
            }).slice(0,900));
            if(value.ok&&value.recordCount>0&&value.dataset?.theme?.legend?.length)ok++;
          }
          console.log('REAL WORLD PROVIDERS:',ok,'of',topics.length);
          if(ok<2)console.log('::warning::Official sources partially unavailable; unit and browser tests still enforce strictly no fabricated values.');
          NODE

  worldbank-fast-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose reduced World Bank query response times
        run: |
          node --input-type=module <<'NODE'
          const paths=[
            '/v2/country/all/indicator/SP.POP.TOTL?format=json&per_page=400&mrv=1',
            '/v2/country/all/indicator/SP.POP.TOTL?format=json&per_page=500&date=2024',
            '/v2/country/BRA;USA;IND;CHN;DEU/indicator/SP.POP.TOTL?format=json&per_page=40&mrv=1'
          ];
          for(const path of paths){
            const start=Date.now();
            try{
              const r=await fetch('https://api.worldbank.org'+path,{signal:AbortSignal.timeout(9000)});
              const data=await r.json();
              console.log('WORLD BANK QUERY',path,'status',r.status,'elapsed',Date.now()-start,
                'rows',Array.isArray(data?.[1])?data[1].length:null,
                'pages',data?.[0]?.pages,'total',data?.[0]?.total);
            }catch(e){console.log('WORLD BANK QUERY ERROR',path,String(e),'elapsed',Date.now()-start);}
          }
          NODE
