name: Total Orchestration Check

on:
  push:
    paths:
      - 'index.html'
      - 'modules/ultron-core-bridge-v4270.js'
      - 'modules/ultron-orchestrator-v4270.js'
      - 'modules/neural-priority-core-v4300.js'
      - 'modules/orchestrator-device-verify-v4270.js'
      - 'modules/voice-listener-v4290.js'
      - 'modules/voice-match-v4290.js'
      - 'modules/voice-orchestration-bridge-v4290.js'
      - 'modules/orchestrator-ui-bridge-v4270.js'
      - 'modules/telemetry-client-v4270.js'
      - 'backend/orchestration-engine.js'
      - 'backend/worker.js'
      - 'backend/wrangler.jsonc'
      - '.github/workflows/total-orchestration-check.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'modules/ultron-core-bridge-v4270.js'
      - 'modules/ultron-orchestrator-v4270.js'
      - 'modules/neural-priority-core-v4300.js'
      - 'modules/orchestrator-device-verify-v4270.js'
      - 'modules/voice-listener-v4290.js'
      - 'modules/voice-match-v4290.js'
      - 'modules/voice-orchestration-bridge-v4290.js'
      - 'modules/orchestrator-ui-bridge-v4270.js'
      - 'modules/telemetry-client-v4270.js'
      - 'backend/orchestration-engine.js'
      - 'backend/worker.js'
      - 'backend/wrangler.jsonc'
      - '.github/workflows/total-orchestration-check.yml'
  workflow_dispatch:

jobs:
  total-orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check orchestration runtime
        run: |
          node --check modules/ultron-core-bridge-v4270.js
          node --check modules/ultron-orchestrator-v4270.js
          node --check modules/neural-priority-core-v4300.js
          node --check modules/orchestrator-device-verify-v4270.js
          node --check modules/voice-listener-v4290.js
          node --check modules/voice-match-v4290.js
          node --check modules/voice-orchestration-bridge-v4290.js
          node --check modules/orchestrator-ui-bridge-v4270.js
          node --check modules/telemetry-client-v4270.js
          node --check backend/orchestration-engine.js
          node --check backend/worker.js

      - name: Verify persistent orchestration backend
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS orchestration_runs' backend/orchestration-engine.js
          grep -q 'CREATE TABLE IF NOT EXISTS orchestration_steps' backend/orchestration-engine.js
          grep -q 'buildOperationalPlan' backend/orchestration-engine.js
          grep -q 'startOrchestration' backend/orchestration-engine.js
          grep -q 'recordOrchestrationStep' backend/orchestration-engine.js
          grep -q 'finishOrchestration' backend/orchestration-engine.js
          grep -q 'resultVerification: true' backend/orchestration-engine.js
          grep -q 'multiStep: true' backend/orchestration-engine.js
          grep -q '"/api/orchestrator/start"' backend/worker.js
          grep -q '"/api/orchestrator/step"' backend/worker.js
          grep -q '"/api/orchestrator/finish"' backend/worker.js
          grep -q '"/api/orchestrator/history"' backend/worker.js
          grep -q '"/api/orchestrator/state"' backend/worker.js
          grep -q 'totalIntegration: true' backend/worker.js
          grep -q 'safeSelfHeal: true' backend/worker.js
          grep -q 'async scheduled' backend/worker.js
          grep -q 'processDueAutomations' backend/worker.js
          grep -q '"main": "worker.js"' backend/wrangler.jsonc
          ! grep -q 'import baseWorker' backend/worker.js
          ! grep -Eq '"main": "worker-v[0-9]+\.js"' backend/wrangler.jsonc
          grep -q '"\* \* \* \* \*"\]' backend/wrangler.jsonc

      - name: Verify unified frontend routing and priority gate
        run: |
          grep -q 'ULTRON_ORCHESTRATOR' modules/ultron-orchestrator-v4270.js
          grep -q 'splitCompound' modules/ultron-orchestrator-v4270.js
          grep -q 'multi-step' modules/ultron-orchestrator-v4270.js
          grep -q 'ULTRON_DEVICES' modules/ultron-orchestrator-v4270.js
          grep -q 'ULTRON_VISION_ROUTER' modules/ultron-orchestrator-v4270.js
          grep -q 'ULTRON_NEURAL_3D' modules/ultron-orchestrator-v4270.js
          grep -q 'ULTRON_CORE' modules/ultron-orchestrator-v4270.js
          grep -q 'SELF-HEAL' modules/ultron-orchestrator-v4270.js
          grep -q 'ULTRON_PRIORITY' modules/neural-priority-core-v4300.js
          grep -q 'EMERGENCY STOP' modules/neural-priority-core-v4300.js
          grep -q '/api/control/status' modules/orchestrator-device-verify-v4270.js
          grep -q 'verificationTimeout: true' modules/orchestrator-device-verify-v4270.js
          grep -q 'command.status === "completed"' modules/orchestrator-device-verify-v4270.js
          grep -q 'ULTRON_VOICE_ORCHESTRATION_BRIDGE' modules/voice-orchestration-bridge-v4290.js
          grep -q 'wakeAwareDispatch: true' modules/voice-orchestration-bridge-v4290.js
          grep -q 'ULTRON_ORCHESTRATOR_UI' modules/orchestrator-ui-bridge-v4270.js
          grep -q 'window.ULTRON_CORE' modules/ultron-core-bridge-v4270.js

      - name: Verify proactive telemetry without emotion or motion classifier
        run: |
          grep -q 'orchestration:' modules/telemetry-client-v4270.js
          grep -q 'proactiveRecoveries' modules/telemetry-client-v4270.js
          grep -q 'holographic3d' modules/telemetry-client-v4270.js
          grep -q 'optical:' modules/telemetry-client-v4270.js
          ! grep -q 'emotionEstimate' modules/telemetry-client-v4270.js
          ! grep -q 'reaction-activity' modules/telemetry-client-v4270.js
          ! grep -q '^    motion:' modules/telemetry-client-v4270.js

      - name: Verify orchestration runtime load order and current release marker
        run: |
          grep -Eq '(TOTAL ORCHESTRATION|P0→P5|NEURAL INTERACTION)' index.html
          grep -Eq '(TOTAL INTEGRATION // v4\.27\.0|HOLOGRAPHIC FILESPACE // v4\.28\.0|VOICE MATCH WAKE CORE // v4\.29\.0|NEURAL INTERACTION CORE // v4\.30\.0)' index.html
          grep -q 'ultron-core-bridge-v4270.js?v=4.27.0' index.html
          grep -q 'ultron-orchestrator-v4270.js?v=4.27.0' index.html
          grep -q 'neural-priority-core-v4300.js?v=4.30.0' index.html
          grep -q 'device-control-v4260.js?v=4.26.0' index.html
          grep -q 'orchestrator-device-verify-v4270.js?v=4.27.0' index.html
          grep -q 'telemetry-client-v4270.js?v=4.27.0' index.html
          grep -q 'voice-match-v4290.js?v=4.29.0' index.html
          grep -q 'voice-listener-v4290.js?v=4.29.0' index.html
          grep -q 'voice-orchestration-bridge-v4290.js?v=4.29.0' index.html
          grep -q 'orchestrator-ui-bridge-v4270.js?v=4.27.0' index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('index.html', 'utf8');
          const order = [
            'ultron-core-bridge-v4270.js',
            'ultron-orchestrator-v4270.js',
            'neural-priority-core-v4300.js',
            'device-control-v4260.js',
            'orchestrator-device-verify-v4270.js',
            'voice-match-v4290.js',
            'voice-listener-v4290.js',
            'voice-orchestration-bridge-v4290.js',
            'orchestrator-ui-bridge-v4270.js'
          ];
          let previous = -1;
          for (const marker of order) {
            const index = html.indexOf(marker);
            if (index < 0) throw new Error(`missing ${marker}`);
            if (index <= previous) throw new Error(`load order invalid at ${marker}`);
            previous = index;
          }
          console.log('Total orchestration load order OK');
          NODE

      - name: Verify safety boundaries
        run: |
          grep -q 'activeDeviceActionsRequireIntent: true' backend/worker.js
          grep -q 'destructiveActionsBlockedWithoutPolicy: true' backend/worker.js
          grep -q 'observe-auto/active-confirm/destructive-block' backend/orchestration-engine.js
          ! grep -qi 'desktop\.shell\|shell\.exec\|eval(' modules/ultron-orchestrator-v4270.js modules/neural-priority-core-v4300.js
          echo 'Total orchestration safety and integration checks passed.'
