name: JARVIS intelligent hubs
on:
  pull_request:
    paths:
      - 'backend/skill-hub.js'
      - 'backend/intelligent-task-hub.js'
      - 'backend/jarvis-authenticated-intelligence.js'
      - 'tests/jarvis-authenticated-intelligence.mjs'
      - 'backend/jarvis-account-access.js'
      - 'backend/worker.js'
      - 'backend/memory-relevance.js'
      - 'backend/memory-context.js'
      - 'backend/memory.js'
      - 'tests/jarvis-memory-context.mjs'
      - 'tests/jarvis-memory-relevance.mjs'
      - 'backend/trajectory-hub.js'
      - 'modules/ultron-orchestrator-v4270.js'
      - 'modules/jarvis-verified-intelligence-client.js'
      - 'tests/jarvis-verified-intelligence-client.mjs'
      - 'tests/jarvis-verified-weather-scene.mjs'
      - 'modules/jarvis-evidence-progress.js'
      - 'modules/jarvis-operational-selftest.js'
      - 'tests/jarvis-operational-selftest.mjs'
      - 'tests/jarvis-access-origin-cors.mjs'
      - 'modules/jarvis-live-runtime-observation.js'
      - 'tests/jarvis-live-runtime-observation.mjs'
      - 'tests/jarvis-evidence-progress.mjs'
      - 'data/jarvis-100-acceptance-manifest.json'
      - 'modules/jarvis-global-weather.js'
      - 'modules/jarvis-geospatial-model.js'
      - 'tests/jarvis-intelligent-hubs.mjs'
      - '.github/workflows/jarvis-intelligent-hubs.yml'
  push:
    branches: [main]
jobs:
  hubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/jarvis-intelligent-hubs.mjs
      - run: node tests/jarvis-authenticated-intelligence.mjs
      - run: node tests/jarvis-verified-intelligence-client.mjs
      - run: node tests/jarvis-verified-weather-scene.mjs
      - run: node tests/jarvis-live-runtime-observation.mjs
      - run: node tests/jarvis-memory-relevance.mjs
      - run: node tests/jarvis-memory-context.mjs
