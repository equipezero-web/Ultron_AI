name: JARVIS Remote Android Filespace
on:
  push:
    paths:
      - "modules/jarvis-phone-files.js"
      - "modules/jarvis-phone-files.css"
      - "index.html"
      - "backend/device-bridge.js"
      - "backend/device-control-v2.js"
      - "tests/jarvis-phone-files-security.mjs"
      - "tests/jarvis-phone-folder-commands.mjs"
      - "tests/jarvis-voice-tv-security.mjs"
      - "modules/voice-listener-v4290.js"
      - "modules/device-control-v4260.js"
      - "modules/jarvis-voice-controls.js"
      - "modules/jarvis-neural-jarvis-hud.js"
      - "tests/jarvis-voice-enabled-browser.mjs"
      - "tests/jarvis-mobile-voice-text-browser.mjs"
      - "modules/jarvis-mobile-voice-text.js"
      - "modules/jarvis-mobile-voice-text.css"
      - "modules/jarvis-local-commands.js"
      - ".github/workflows/jarvis-remote-phone-files.yml"
  pull_request:
    paths:
      - "modules/jarvis-phone-files.js"
      - "modules/jarvis-phone-files.css"
      - "index.html"
      - "backend/device-bridge.js"
      - "backend/device-control-v2.js"
      - "tests/jarvis-phone-files-security.mjs"
      - ".github/workflows/jarvis-remote-phone-files.yml"
permissions:
  contents: read
jobs:
  remote-files-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend and backend syntax
        run: |
          node --check modules/jarvis-phone-files.js
          node --check modules/jarvis-local-commands.js
          node --check modules/jarvis-voice-controls.js
          node --check modules/device-control-v4260.js
          node --check modules/voice-listener-v4290.js
          node --check backend/device-bridge.js
          node --check backend/device-control-v2.js
      - name: File access authorization and security contract
        run: |
          node tests/jarvis-phone-files-security.mjs
          node tests/jarvis-phone-folder-commands.mjs
          node tests/jarvis-voice-tv-security.mjs

  voice-controls-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test harness
        run: |
          npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24.33.0
          echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: Voice, microphone permission and visible controls on phone/notebook/TV
        run: |
          python3 -m http.server 8772 --bind 127.0.0.1 >/tmp/jarvis-voice-enabled.log 2>&1 &
          sleep 2
          node tests/jarvis-voice-enabled-browser.mjs
          node tests/jarvis-mobile-voice-text-browser.mjs
