name: Earth Explorer Check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'modules/jarvis-earth.js'
      - 'modules/jarvis-command-center-v4330.css'
      - 'modules/jarvis-command-center-v4330.js'
      - 'modules/ultron-orchestrator-v4270.js'
      - 'script.js'
      - 'tests/earth-dom-smoke.mjs'
      - '.github/workflows/earth-explorer-check.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'modules/jarvis-earth.js'
      - 'modules/jarvis-command-center-v4330.css'
      - 'modules/jarvis-command-center-v4330.js'
      - 'modules/ultron-orchestrator-v4270.js'
      - 'script.js'
      - 'tests/earth-dom-smoke.mjs'
      - '.github/workflows/earth-explorer-check.yml'

jobs:
  earth-explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check modules/jarvis-earth.js
          node --check modules/jarvis-command-center-v4330.js
          node --check modules/ultron-orchestrator-v4270.js
          node --check script.js
      - name: Verify one Neural Ring sphere and command routing
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const earth = fs.readFileSync('modules/jarvis-earth.js', 'utf8');
          const css = fs.readFileSync('modules/jarvis-command-center-v4330.css', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const router = fs.readFileSync('modules/ultron-orchestrator-v4270.js', 'utf8');
          for (const required of [
            'window.ULTRON_EARTH', 'jarvis-cc-visual', 'jarvis-earth-globe',
            '.showAtmosphere(false)', '.backgroundColor(', 'onGlobeClick',
            'pointOfView', 'jarvis-earth-expanded', 'jarvis-earth-selection-close',
            'api.mapbox.com/search/geocode/v6/forward',
          ]) assert.ok(earth.includes(required), 'Missing integrated Earth feature: ' + required);
          for (const forbidden of ['jarvis-earth-explorer', 'jarvis-earth-toolbar', 'jarvis-earth-search', 'jarvis-earth-token', 'jarvis-earth-side']) {
            assert.ok(!earth.includes(forbidden), 'Earth must not create extra UI: ' + forbidden);
          }
          assert.ok(css.includes('.jarvis-earth-globe') && css.includes('.jarvis-earth-expanded'), 'Neural Ring styling missing');
          assert.ok(html.includes('jarvis-earth.js?v=4.44.0'), 'Earth release version missing');
          assert.ok(html.includes('jarvis-command-center-v4330.css?v=4.44.0'), 'Earth CSS version missing');
          assert.equal((html.match(/src="modules\/jarvis-earth.js/g) || []).length, 1, 'Earth module must load only once');
          assert.ok(!/pk\.eyJ[A-Za-z0-9._-]+/.test(earth), 'No literal Mapbox token in Git');
          const a = router.indexOf('const geoAliases ='), b = router.indexOf('function isEarthStatusIntent(', a);
          assert.ok(a >= 0 && b > a, 'Earth natural language parser missing');
          const normalize = text => String(text || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
          const parse = new Function('normalize', router.slice(a,b)+'\nreturn parseEarthIntent;')(normalize);
          assert.equal(parse('Jarvis no globo ache a China')?.place, 'china');
          assert.equal(parse('Jarvis encontre a China no globo')?.place, 'china');
          assert.equal(parse('Mostre a câmera'), null);
          console.log('EARTH module and voice text routing integrity passed');
          NODE
      - name: Earth DOM behavior smoke
        run: |
          npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0
          node tests/earth-dom-smoke.mjs
