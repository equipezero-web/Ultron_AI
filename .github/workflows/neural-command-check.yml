name: Neural Command Check

on:
  push:
    paths:
      - 'index.html'
      - 'modules/neural-command-policy.mjs'
      - 'modules/neural-command-router.js'
      - 'modules/neural-input-bus.js'
      - 'modules/neural-parity.js'
      - 'modules/stark-hand-gesture-v420.js'
      - 'modules/palm-matrix-v420.js'
      - 'modules/neural-gesture-v420.css'
      - 'modules/file-inspector-v420.js'
      - 'modules/neural-file-visualizer.js'
      - 'modules/mobile-camera-source.js'
      - 'modules/stark-bootstrap.js'
      - 'local-core/server.py'
      - '.github/workflows/neural-command-check.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'modules/neural-command-policy.mjs'
      - 'modules/neural-command-router.js'
      - 'modules/stark-hand-gesture-v420.js'
      - 'modules/palm-matrix-v420.js'
      - 'modules/neural-gesture-v420.css'
      - 'modules/file-inspector-v420.js'
      - 'modules/neural-file-visualizer.js'
      - 'modules/mobile-camera-source.js'
      - 'modules/stark-bootstrap.js'
      - 'local-core/server.py'
      - '.github/workflows/neural-command-check.yml'

jobs:
  neural-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: |
          node --check modules/neural-command-router.js
          node --check modules/neural-input-bus.js
          node --check modules/neural-parity.js
          node --check modules/stark-hand-gesture-v420.js
          node --check modules/palm-matrix-v420.js
          node --check modules/file-inspector-v420.js
          node --check modules/neural-file-visualizer.js
          node --check modules/mobile-camera-source.js
          node --check modules/stark-bootstrap.js
          node --check modules/neural-command-policy.mjs
          python -m py_compile local-core/server.py

      - name: Neural policy v4.20 behavior
        run: |
          node --input-type=module <<'NODE'
          import { normalizeNeuralAction, neuralSignature, validateNeuralAction } from './modules/neural-command-policy.mjs';
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(normalizeNeuralAction('two open palms') === 'activate', 'activation normalization failed');
          assert(normalizeNeuralAction('dial') === 'rotate', 'rotation normalization failed');
          assert(normalizeNeuralAction('open fist') === 'zoom-in', 'zoom-in normalization failed');
          assert(normalizeNeuralAction('close palm') === 'zoom-out', 'zoom-out normalization failed');
          assert(validateNeuralAction('activate', { confidence: 0.8, handCount: 2 }).ok, 'two-palm activation should pass');
          assert(!validateNeuralAction('activate', { confidence: 0.8, handCount: 1 }).ok, 'one hand must not activate');
          assert(validateNeuralAction('rotate', { confidence: 0.8, delta: 0.04 }).ok, 'rotation should pass');
          assert(validateNeuralAction('zoom-in', { confidence: 0.8, scale: 1.3, openness: 0.6 }).ok, 'zoom-in should pass');
          assert(validateNeuralAction('zoom-out', { confidence: 0.8, scale: 1, openness: 0.2 }).ok, 'zoom-out should pass');
          assert(validateNeuralAction('pinch-select', { target: 'ARQUIVO', cameraTap: true }).ok, 'pinch + camera touch should pass');
          assert(!validateNeuralAction('pinch-select', { target: 'ARQUIVO' }).ok, 'pinch without camera touch must fail');
          assert(neuralSignature('rotate', { delta: -0.2 }) === 'rotate:ccw', 'rotation signature failed');
          console.log('Neural policy v4.20 OK');
          NODE

      - name: Gesture semantics v4.20
        run: |
          grep -q "numHands: 2" modules/stark-hand-gesture-v420.js
          grep -q "two-open-palms" modules/stark-hand-gesture-v420.js
          grep -q "Pointing_Up" modules/stark-hand-gesture-v420.js
          grep -q "pinchRatio < 0.39" modules/stark-hand-gesture-v420.js
          grep -q "cameraTap: true" modules/stark-hand-gesture-v420.js
          grep -q "approachRate > 0.48" modules/stark-hand-gesture-v420.js
          grep -q "video.readyState < 2" modules/stark-hand-gesture-v420.js
          ! grep -q "FIST=FREEZE" modules/stark-bootstrap.js
          grep -q "ultron:palm-rotate" modules/neural-command-router.js
          grep -q "ultron:palm-zoom-in" modules/neural-command-router.js
          grep -q "ultron:palm-zoom-out" modules/neural-command-router.js
          grep -q -- "--gesture-scale" modules/palm-matrix-v420.js
          grep -q "zoomPhase = 'opening'" modules/palm-matrix-v420.js
          grep -q "zoomPhase = 'closing'" modules/palm-matrix-v420.js
          echo 'Gesture semantics v4.20 OK'

      - name: Unified file and image preview markers
        run: |
          grep -q "UNIFIED FILE VIEW" modules/file-inspector-v420.js
          grep -q "ULTRON_FILE_INSPECTOR" modules/file-inspector-v420.js
          grep -q "/raw" modules/file-inspector-v420.js
          grep -q "ULTRON_VISUAL_PANEL" modules/neural-file-visualizer.js
          grep -q "neural-live.js?v=4.20.0" modules/stark-bootstrap.js
          grep -q '@app.get("/file/{file_id}/raw")' local-core/server.py
          grep -q 'rawFilePreview' local-core/server.py
          echo 'Unified file preview and Neural image rendering OK'

      - name: Smartphone camera markers
        run: |
          grep -q "droidcam|iriun|camo|epoccam" modules/mobile-camera-source.js
          grep -q "captureStream" modules/mobile-camera-source.js
          grep -q "Mixed Content" modules/mobile-camera-source.js
          grep -q "SMARTPHONE NETWORK STREAM" modules/mobile-camera-source.js
          grep -q "USAR CÂMERA DO CELULAR" modules/mobile-camera-source.js
          echo 'Smartphone camera sources OK'

      - name: Integration markers
        run: |
          grep -q "stark-bootstrap.js?v=4.20.0" index.html
          grep -q "NEURAL GESTURE + MOBILE CAMERA + ULTRON_DATA // v4.20.0" index.html
          grep -q "stark-hand-gesture-v420.js?v=4.20.0" modules/stark-bootstrap.js
          grep -q "palm-matrix-v420.js?v=4.20.0" modules/stark-bootstrap.js
          grep -q "file-inspector-v420.js?v=4.20.0" modules/stark-bootstrap.js
          grep -q "mobile-camera-source.js?v=4.20.0" modules/stark-bootstrap.js
          grep -q "handControlModel" modules/stark-bootstrap.js
          echo 'Neural Gesture v4.20 integration markers OK'
