name: Ultron Multi-device UI Check

on:
  pull_request:
    paths:
      - 'index.html'
      - 'modules/ultron-adaptive-display.css'
      - 'modules/ultron-tv-display.js'
      - 'modules/ultron-neural-answer.js'
      - 'modules/ultron-neural-answer.css'
      - 'tests/neural-answer-smoke.mjs'
      - 'modules/jarvis-earth.js'
      - 'modules/jarvis-geospatial-model.js'
      - 'modules/jarvis-geospatial-visual.js'
      - 'modules/jarvis-geospatial-visual.css'
      - 'tests/jarvis-phase3-geospatial.mjs'
      - 'tests/jarvis-phase4.mjs'
      - 'tests/jarvis-global-weather.mjs'
      - 'modules/jarvis-spatial-intensity.js'
      - 'tests/jarvis-spatial-intensity.mjs'
      - 'modules/jarvis-world-geodata.js'
      - 'modules/jarvis-world-intent.js'
      - 'tests/jarvis-world-geodata.mjs'
      - 'tests/jarvis-weather-intelligence.mjs'
      - 'tests/jarvis-weather-monitor.mjs'
      - 'backend/weather-intelligence.js'
      - 'modules/jarvis-weather-insight-model.js'
      - 'modules/jarvis-global-weather.js'
      - 'backend/weather-global.js'
      - 'backend/weather-watchlist.js'
      - 'tests/jarvis-weather-watchlist.mjs'
      - 'modules/jarvis-weather-model.js'
      - 'modules/jarvis-action-engine.js'
      - 'backend/weather-live.js'
      - 'tests/neural-mobile-smoke.mjs'
      - '.github/workflows/ultron-responsive-check.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'modules/ultron-adaptive-display.css'
      - 'modules/ultron-tv-display.js'
      - 'modules/ultron-neural-answer.js'
      - 'modules/ultron-neural-answer.css'
      - 'tests/neural-answer-smoke.mjs'
      - 'modules/jarvis-earth.js'
      - 'modules/jarvis-geospatial-model.js'
      - 'modules/jarvis-geospatial-visual.js'
      - 'modules/jarvis-geospatial-visual.css'
      - 'tests/jarvis-phase3-geospatial.mjs'
      - 'tests/jarvis-phase4.mjs'
      - 'tests/jarvis-global-weather.mjs'
      - 'modules/jarvis-spatial-intensity.js'
      - 'tests/jarvis-spatial-intensity.mjs'
      - 'modules/jarvis-world-geodata.js'
      - 'modules/jarvis-world-intent.js'
      - 'tests/jarvis-world-geodata.mjs'
      - 'tests/jarvis-weather-intelligence.mjs'
      - 'tests/jarvis-weather-monitor.mjs'
      - 'backend/weather-intelligence.js'
      - 'modules/jarvis-weather-insight-model.js'
      - 'modules/jarvis-global-weather.js'
      - 'backend/weather-global.js'
      - 'backend/weather-watchlist.js'
      - 'tests/jarvis-weather-watchlist.mjs'
      - 'modules/jarvis-weather-model.js'
      - 'modules/jarvis-action-engine.js'
      - 'backend/weather-live.js'
      - 'tests/neural-mobile-smoke.mjs'
      - '.github/workflows/ultron-responsive-check.yml'
  workflow_dispatch:

jobs:
  ui-multidevice:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate interface assets
        run: |
          node --check modules/ultron-tv-display.js
          node --check modules/ultron-neural-answer.js
          node --check script.js
          node --check backend/web-research.js
          node --check backend/providers.js
          node --check modules/jarvis-earth.js
          node --check modules/jarvis-geospatial-model.js
          node --check modules/jarvis-geospatial-visual.js
          node tests/jarvis-phase3-geospatial.mjs
          node tests/jarvis-phase4.mjs
          node --check modules/jarvis-global-weather.js
          node --check backend/weather-global.js
          node tests/jarvis-global-weather.mjs
          node --check modules/jarvis-spatial-intensity.js
          node tests/jarvis-spatial-intensity.mjs
          node --check modules/jarvis-world-geodata.js
          node --check modules/jarvis-world-intent.js
          node tests/jarvis-world-geodata.mjs
          node --check backend/weather-watchlist.js
          node tests/jarvis-weather-watchlist.mjs
          node tests/jarvis-weather-intelligence.mjs
          node tests/jarvis-weather-monitor.mjs
          grep -Fq 'ultron-adaptive-display.css' index.html
          grep -Fq 'ultron-tv-display.js' index.html
          grep -Fq 'ultron-tv-display' modules/ultron-adaptive-display.css
          grep -Fq 'max-width:820px' modules/ultron-adaptive-display.css
      - name: Install headless browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24.33.0
          echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      # This shared smoke suite also verifies weather maps and the new evidence panel.
      # Running it in two concurrent jobs previously caused nondeterministic Chromium timeouts.
      - name: Verify mobile ring, worldwide weather map and evidence panel
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/ultron-responsive-http.log 2>&1 &
          sleep 2
          node tests/neural-mobile-smoke.mjs
          node tests/neural-answer-smoke.mjs
      - name: Verify TV and notebook presentation
        run: |
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import assert from 'node:assert/strict';
          const browser=await puppeteer.launch({
            executablePath:process.env.CHROME_BIN||'/usr/bin/google-chrome',
            headless:true,pipe:true,timeout:60000,args:['--no-sandbox','--disable-dev-shm-usage','--no-zygote','--disable-background-networking','--enable-webgl','--enable-unsafe-swiftshader']
          });
          try {
            for(const item of [
              {width:1366,height:768,tv:false},
              {width:1920,height:1080,tv:true}
            ]){
              const page=await browser.newPage();
              await page.setViewport({width:item.width,height:item.height});
              await page.goto('http://127.0.0.1:8766/'+(item.tv?'?display=tv':''),{waitUntil:'domcontentloaded'});
              await page.waitForSelector('.jarvis-command-center-ui');
              const state=await page.evaluate(()=>({
                tv:document.body.classList.contains('ultron-tv-display'),
                overflow:document.documentElement.scrollWidth-innerWidth,
                visual:!!document.querySelector('.jarvis-cc-visual'),
                commands:!!document.getElementById('command-input')
              }));
              assert.equal(state.tv,item.tv);
              assert.ok(state.overflow<=3,'No horizontal overflow');
              assert.ok(state.visual&&state.commands,'Original neural display and command remain mounted');

              // Ensure the evidence panel also loads in independent notebook/TV runs.
              await page.waitForFunction(()=>Boolean(window.ULTRON_NEURAL_ANSWER),{timeout:15000});
              const evidence=await page.evaluate(()=>{
                window.ULTRON_NEURAL_ANSWER.show('Notícias de teste',{liveData:{
                  news:true,eventCorrelation:{events:[{
                    event_id:'news-event-feedface',title:'Evento público de teste',
                    summary:'Apenas um resumo de fonte',timestamp:'2026-11-24T15:00:00Z',
                    sources:[{source:'Fonte A',domain:'example.org',
                      url:'https://example.org/noticia',publishedAt:'2026-11-24T15:00:00Z'}],
                    evidenceReview:{discrepancies:[]}
                  }]}
                }});
                const item=document.querySelector('.ultron-evidence-event');
                item?.querySelector('summary')?.click();
                return {mounted:Boolean(item),opened:item?.open,
                  insideRing:Boolean(item?.closest('.jarvis-cc-center')),
                  warning:item?.querySelector('.ultron-evidence-status')?.textContent||'',
                  links:item?.querySelectorAll('a').length||0};
              });
              assert.equal(evidence.mounted,true,'News evidence UI must load on laptop and TV');
              assert.equal(evidence.opened,true,'News details must expand');
              assert.equal(evidence.insideRing,true,'News details stay inside Neural Ring');
              assert.match(evidence.warning,/não verificado/);
              assert.equal(evidence.links,1);

              await page.close();
            }
            console.log('LAPTOP & TV PRESENTATION PASS');
          } finally { await browser.close(); }
          NODE

