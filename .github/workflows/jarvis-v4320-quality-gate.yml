name: JARVIS v4.32 Quality Gate

on:
  push:
    branches:
      - main
      - feature/jarvis-v4320-unified-upgrade
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate canonical backend
        run: |
          node --check backend/worker.js
          node --check backend/providers.js
          grep -q 'durationMs: Date.now() - startedAt' backend/providers.js
          grep -q 'status: "failed"' backend/providers.js
          grep -q 'status: "success"' backend/providers.js
          node --check backend/smart-router.js
          test -f backend/wrangler.jsonc
          grep -q 'WORKER_ENTRYPOINT = "worker.js"' backend/worker.js

      - name: Validate JARVIS v4.32 runtime
        run: |
          node --check modules/jarvis-performance-governor-v4320.js
          node --check modules/jarvis-runtime-v4320.js
          node --check modules/stark-bootstrap.js
          grep -q 'jarvis-performance-governor-v4320' modules/stark-bootstrap.js
          grep -q 'jarvis-runtime-v4320' modules/stark-bootstrap.js
          grep -q "version: '4.32.0'" modules/jarvis-runtime-v4320.js

      - name: Adaptive dual-screen layout
        run: |
          node --check modules/jarvis-dual-display.js
          node tests/jarvis-dual-display.mjs

      - name: Semantic operator intent
        run: |
          node --check backend/worker.js
          node --check modules/jarvis-action-engine.js
          node tests/jarvis-semantic-operator.mjs
          node tests/jarvis-linguistic-context.mjs
          node tests/jarvis-contextual-continuity.mjs
          node tests/jarvis-unified-identity.mjs
          node tests/jarvis-unified-cognition.mjs
          node tests/jarvis-complete-answer-budget.mjs
          node tests/jarvis-world-news-correlation.mjs
          node tests/jarvis-world-evidence-audit.mjs
          node tests/jarvis-world-evolution.mjs
          node tests/jarvis-world-news-refresh.mjs
          node tests/jarvis-neural-evidence-panel.mjs
          node --check backend/jarvis-conversation-router.js
          node tests/jarvis-unified-intent.mjs
          node tests/jarvis-p0-intent-regression.mjs
          node tests/jarvis-gateway-fallback-safety.mjs
          node tests/jarvis-stage-b-binding-deadline.mjs
          node tests/jarvis-stage-b-provider-circuit-breaker.mjs
          node tests/jarvis-stage-b-provider-diagnostics.mjs
          node tests/jarvis-stage-b-provider-d1.mjs
          node tests/jarvis-stage-b-disable-providers.mjs
          node tests/jarvis-stage-b-extra-providers.mjs
          node tests/jarvis-stage-b-mistral-429.mjs
          node tests/jarvis-three-provider-operational-mode.mjs
          node --test tests/jarvis-stage-b-provider-error-diagnostics.test.mjs
          node tests/jarvis-time-intent.mjs
          node tests/jarvis-selective-memory.mjs
          node tests/jarvis-stage-a-integrated.mjs
          node tests/jarvis-stage-b-smart-routing.mjs
          node --check backend/worker.js
          node tests/jarvis-stage-a-live-regressions.mjs
          node --check backend/worker.js
          node --check backend/providers.js
          node tests/jarvis-stage-a-conversation-d1-proof.mjs
          node tests/jarvis-stage-a-project-opinion.mjs
          node tests/jarvis-stage-a-frontend-response.mjs

      - name: Guard production secrets
        run: |
          ! grep -RInE '(CLOUDFLARE_API_TOKEN|GEMINI_API_KEY|GROQ_API_KEY|OPENROUTER_API_KEY|COHERE_API_KEY)[[:space:]]*[:=][[:space:]]*["'"'][^"'"']+["'"']' --exclude='*.yml' --exclude='*.yaml' .

      - name: Legacy worker regression guard
        run: |
          ! grep -RInE 'backend/worker-v(2|3|4|5|6)\.js' index.html script.js config.js backend modules/jarvis-* modules/stark-bootstrap.js || (echo 'Legacy worker reference detected in active JARVIS surface' && exit 1)

      - name: Quality summary
        run: |
          echo 'J.A.R.V.I.S v4.32 quality gate passed.'
          echo 'Canonical backend: OK'
          echo 'Performance Governor: OK'
          echo 'Unified Runtime: OK'
          echo 'Secret guard: OK'
          echo 'Legacy worker guard: OK'